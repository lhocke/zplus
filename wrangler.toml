# Cloudflare Pages project "zork" (deploys to zork-3w8.pages.dev).
# Build output: dist/   Functions: functions/ (auto-detected by Pages).
# R2 binding active (bucket provisioned 2026-06-08) — /api/log degrades to 204 if unbound.
name = "zork"
pages_build_output_dir = "./dist"
compatibility_date = "2026-06-07"

# Telemetry sink for /api/log (writes sessions/<id>/<seq>.json).
[[r2_buckets]]
binding = "PLAYTEST"
bucket_name = "zork-playtest"
