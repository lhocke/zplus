name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "Z+ ${{ steps.tag.outputs.tag }}" \
            --notes-file .github/release-notes-template.md \
            --draft

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle_glob: 'src-tauri/target/release/bundle/dmg/*.dmg'
          - os: ubuntu-latest
            bundle_glob: 'src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb'
          - os: windows-latest
            bundle_glob: 'src-tauri/target/release/bundle/msi/*.msi'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install Linux bundler dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libfuse2: linuxdeploy is itself an AppImage and needs FUSE2 to run;
          # ubuntu-24.04 runners do not ship it.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libfuse2

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri bundle
        run: npx tauri build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
          # Fallback for the AppImage toolchain where FUSE is unavailable:
          # self-extract instead of mounting. No effect on macOS/Windows.
          APPIMAGE_EXTRACT_AND_RUN: '1'

      - name: Verify macOS ad-hoc signature (macOS only, sanity check)
        if: matrix.os == 'macos-latest'
        # The dmg bundler cleans the standalone .app after embedding it, so
        # mount the dmg and verify the app inside — that's the artifact users
        # actually receive.
        run: |
          DMG_PATH=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n1)
          test -n "$DMG_PATH"
          MOUNT_DIR=$(mktemp -d)
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          APP_PATH=$(find "$MOUNT_DIR" -maxdepth 1 -name '*.app' | head -n1)
          test -n "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          hdiutil detach "$MOUNT_DIR"

      - name: Upload release assets
        # bash explicitly: the Windows default shell is pwsh, which neither
        # expands the glob nor treats the YAML line continuation as bash does
        # (first run tried to upload a file literally named "\").
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            ${{ matrix.bundle_glob }} --clobber

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.create-release.outputs.tag }}" --draft=false
