# Manual-only deploy to Cloudflare Pages project "zork" (zork-3w8.pages.dev).
#
# Required GitHub Actions repo secrets (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN  — a Cloudflare API token with "Cloudflare Pages:Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account ID (found in the dashboard right sidebar)
#
# The VITE_TURNSTILE_SITEKEY below is the PUBLIC sitekey — safe to hardcode.
# No secret values appear anywhere in this file.

name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build
        env:
          VITE_TURNSTILE_SITEKEY: "0x4AAAAAADgm7Z4BgxQT7f5W"
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Preflight check
        run: npm run preflight

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zork
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
